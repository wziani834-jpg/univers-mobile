<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Demande envoyée | Univers Mobile</title>
    <meta
      name="description"
      content="Votre demande a bien été envoyée à Univers Mobile. La boutique vous répondra rapidement."
    />
    <meta name="robots" content="noindex, follow" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="confirmation-page">
    <main class="confirmation-main">
      <section class="confirmation-hero" aria-labelledby="confirmation-title">
        <div class="container confirmation-shell">
          <a class="confirmation-brand" href="./index.html" aria-label="Retour à l'accueil Univers Mobile">
            <img src="./logo-header.png" alt="Univers Mobile" />
          </a>

          <div class="confirmation-card">
            <div class="confirmation-icon" aria-hidden="true">
              <span></span>
            </div>
            <p class="eyebrow">Demande reçue</p>
            <h1 id="confirmation-title">Votre demande a bien été envoyée.</h1>
            <p>
              Un mail de confirmation vient de vous être envoyé. Univers Mobile vous répondra
              rapidement pour votre réparation ou votre devis.
            </p>
            <div class="confirmation-actions">
              <a class="btn btn-primary" href="./index.html#contact">Revenir au site</a>
              <a class="btn btn-secondary" href="tel:+33689075965">Appeler la boutique</a>
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
